name: Customer Processing Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python customer_processing.py
      
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - run: echo "Deployment to QA Successful"

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - run: echo "Depliyment to PROD Successful"
